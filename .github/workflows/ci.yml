name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests deploy/init_compose.py
      - run: ruff format --check src tests deploy/init_compose.py
      - run: node --check src/solarsense/static/operations/app.js
      - run: pytest -q --junitxml=reports/pytest.xml
      - run: python -m solarsense setup
      - run: python -m solarsense evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-results
          path: reports/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python deploy/init_compose.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/api/v1/stations
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: solarsense:local
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
