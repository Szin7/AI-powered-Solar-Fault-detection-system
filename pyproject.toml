[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsense-student"
version = "1.0.0"
description = "Solar fault monitoring with a reproducible simulator and hardware adapters"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
solarsense = "solarsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarsense = ["static/*", "static/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:X does not have valid feature names:UserWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
